id: secret-hardcoded-password
description: >
  Deterministic positive: an SMTP password literal in a new config object must fail the PR
  with no model call, since no LLM rule covers src/mailer.ts.
rules: ../../fixtures/rules.yaml
pr:
  title: Send order receipts by email
expect:
  verdict: fail
  findings:
    - { rule: no-secrets-in-diff, path: src/mailer.ts, lines: [8, 8] }
budgets: { max_steps: 0, max_tokens: 0, max_cost_usd: 0 }
tags: [secrets, positive, deterministic]
