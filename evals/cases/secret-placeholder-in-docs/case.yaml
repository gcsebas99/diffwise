id: secret-placeholder-in-docs
description: >
  False-positive trap: a README shows key and password placeholders (sk-ant-xxxx…,
  <your-password>); flagging docs teaches people to ignore the check.
rules: ../../fixtures/rules.yaml
pr:
  title: Document configuration
expect:
  verdict: pass
  forbidden:
    - { rule: no-secrets-in-diff }
budgets: { max_steps: 0, max_tokens: 0, max_cost_usd: 0 }
tags: [secrets, negative, deterministic, false-positive-trap]
