name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The action runs dist/index.js from the repo, so a stale bundle ships old code.
      - name: Check dist/ is up to date
        run: |
          pnpm build:action
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is stale. Run 'pnpm build:action' and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
